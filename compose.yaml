services:
  init:
    image: node:20
    user: "root"
    volumes:
      - node_modules:/app/node_modules
      - npm_cache:/npm-cache
    command: sh -lc "mkdir -p /app/node_modules /npm-cache && chown -R ${UID}:${GID} /app/node_modules /npm-cache"

  web:
    image: node:20
    working_dir: /app
    user: "${UID}:${GID}"
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      - HOME=/tmp
      - npm_config_cache=/npm-cache
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - npm_cache:/npm-cache
    ports:
      - "5173:5173"
    command: sh -lc "npm install --include=dev && npm run dev -- --host 0.0.0.0"

volumes:
  node_modules:
  npm_cache:
